spring.application.name=northfit-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/northfit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:NorthfitEcommerceSuperSecretKeyForJWTAuthentication2026Northfit}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
